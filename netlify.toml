[build]
  command = "npm run build"
  publish = "build/client"

[build.environment]
  NODE_VERSION = "22"
  SKIP_OG = "1"

# Production stays on GitHub Pages — skip Netlify production builds.
# `ignore = "exit 0"` always exits 0, which tells Netlify to skip the build.
[context.production]
  ignore = "exit 0"

# Build deploy previews for every pull request.
[context.deploy-preview]
  command = "npm run build"

# Prerendered pages are served as files; everything else gets the SPA fallback.
[[redirects]]
  from = "/*"
  to = "/__spa-fallback.html"
  status = 200
